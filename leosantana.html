<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LÉO</title>

<style>
  :root{
    --bg: #0b0f14;
    --bg-alt: #101720;
    --card: #141c26;
    --border: #223041;
    --text: #e8edf2;
    --muted: #8fa1b3;
    --accent: #4da3ff;
    --green: #3ecf8e;
    /* Quanto o painel de cotações é "ampliado" visualmente (fonte maior),
       sem alterar a largura real da coluna (400px). Ajuste este valor
       para deixar a fonte ainda maior ou menor. */
    --quote-zoom: 1.35;
    /* Altura de cada janela de gráfico (candle 5min). Ajuste este valor
       para deixar os gráficos maiores ou menores. */
    --chart-height: 400px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height:1.6;
  }
  a{color:var(--accent);}

  .wrap{max-width: 2000px; margin:0 auto; padding: 0 20px;}
  header{padding: 16px 0; border-bottom: 1px solid var(--border);}
  h1{font-size: 1.1rem; margin:0; font-weight:700; letter-spacing:0.02em;}

  main{padding:18px 0 80px;}

  .la13-layout{ display:grid; grid-template-columns: 400px 1fr; gap:18px; align-items:start; }
  @media (max-width:1100px){ .la13-layout{ grid-template-columns: 1fr; } }

  .sidebar-header{display:flex; align-items:center; gap:8px; font-size:0.85rem; font-weight:700; margin-bottom:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em;}
  .sidebar-dot{width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; box-shadow:0 0 0 3px rgba(62,207,142,0.2);}

  .embed-card{
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px;
    overflow-x:hidden;
    overflow-y:auto;
    min-height:200px;
    resize: vertical;
    position:sticky; top:18px;
  }

  /* --- Ampliação visual do painel de cotações (sem mudar a largura ocupada) --- */
  .quote-zoom-outer{ width:100%; overflow:hidden; }
  .quote-zoom-inner{
    width: calc(100% / var(--quote-zoom));
    transform: scale(var(--quote-zoom));
    transform-origin: top left;
  }

  .widget-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:0;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }
  .widget-card{
    background: var(--card); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:0; height:var(--chart-height); min-height:180px; display:flex; flex-direction:column;
    position:relative;
    resize: vertical;
    overflow: hidden;
  }
  .widget-card:nth-child(3n){ border-right:none; }
  .widget-card:nth-child(n+4){ border-bottom:none; }
  .widget-card .mini-quote{ height:110px; flex-shrink:0; border-bottom:1px solid var(--border); overflow:hidden; position:relative; }
  .widget-card .tradingview-widget-container{flex:1; min-height:0;}
  @media (max-width:1400px) and (min-width:1101px){
    .widget-grid{ grid-template-columns: repeat(2, 1fr); }
    .widget-card:nth-child(3n){ border-right:1px solid var(--border); }
    .widget-card:nth-child(2n){ border-right:none; }
    .widget-card:nth-child(n+5){ border-bottom:none; }
  }
  @media (max-width:700px){
    .widget-grid{ grid-template-columns: 1fr; }
    .widget-card{ border-right:none !important; border-bottom:1px solid var(--border) !important; height:320px; }
    .widget-card:last-child{ border-bottom:none !important; }
  }
  .tradingview-widget-container{width:100%;}
  .tradingview-widget-copyright{font-size:0.7rem; color:var(--muted); text-align:right; padding-top:2px;}
  .tradingview-widget-copyright a{color:var(--muted);}

  /* --- Faixa de cotações (ticker) abaixo da grade de gráficos --- */
  .ticker-card{
    margin-top:18px;
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    overflow:hidden;
  }

  /* --- Bloqueio da marca do TradingView em cada card --- */
  .logo-cover{
    position:absolute; z-index:5;
    background: var(--card);
    pointer-events:none;
  }
  .logo-cover--quote{ top:0; right:0; width:38px; height:34px; }
  .logo-cover--chart{ bottom:0; left:0; width:60px; height:90px; background: rgba(20,28,38,1); }
</style>

<script>
(function () {
  var grid = document.getElementById('widget-grid');
  if (!grid) return;

  function getCards() {
    return Array.prototype.slice.call(grid.querySelectorAll('.widget-card'));
  }

  // --- Redimensionar arrastando o canto (persiste por gráfico) ---
  var HEIGHT_KEY = 'leosantana_widget_heights';
  var savedHeights = {};
  try { savedHeights = JSON.parse(localStorage.getItem(HEIGHT_KEY) || '{}'); } catch (e) {}

  getCards().forEach(function (card) {
    var key = card.dataset.key;
    if (savedHeights[key]) {
      card.style.height = savedHeights[key] + 'px';
    }
  });

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function (entries) {
      entries.forEach(function (entry) {
        var card = entry.target;
        var key = card.dataset.key;
        if (!key) return;
        savedHeights[key] = Math.round(entry.contentRect.height);
        try { localStorage.setItem(HEIGHT_KEY, JSON.stringify(savedHeights)); } catch (e) {}
      });
    });
    getCards().forEach(function (card) { ro.observe(card); });
  }
})();

// --- Redimensionar o painel de cotações (independente dos gráficos) ---
(function () {
  var QUOTE_HEIGHT_KEY = 'leosantana_quote_height';
  var quoteCard = document.querySelector('.sidebar-header + .embed-card');
  if (!quoteCard) return;

  try {
    var savedQuoteHeight = localStorage.getItem(QUOTE_HEIGHT_KEY);
    if (savedQuoteHeight) quoteCard.style.height = savedQuoteHeight + 'px';
  } catch (e) {}

  if (window.ResizeObserver) {
    var roQuote = new ResizeObserver(function (entries) {
      entries.forEach(function (entry) {
        try { localStorage.setItem(QUOTE_HEIGHT_KEY, Math.round(entry.contentRect.height)); } catch (e) {}
      });
    });
    roQuote.observe(quoteCard);
  }
})();
</script>
